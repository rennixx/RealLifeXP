                Initialize System
            </button>

<script>
        document.addEventListener('DOMContentLoaded', () => {
            const cards = document.querySelectorAll('.category-card');
            const countDisplay = document.getElementById('selection-count');
            const continueBtn = document.getElementById('continue-btn');
            let selectedCount = 0;
            const minRequired = 3;
            const maxAllowed = 6;

            const baseColorClass = 'border-primary bg-primary/10 shadow-[0_0_15px_rgba(255,213,151,0.2)]';

            cards.forEach(card => {
                card.addEventListener('click', () => {
                    const isSelected = card.classList.contains('selected');
                    const colorClasses = baseColorClass.split(' ');

                    if (isSelected) {
                        card.classList.remove('selected');
                        card.classList.remove(...colorClasses);
                        card.classList.add('border-outline-variant', 'bg-surface-container');
                        selectedCount--;
                    } else {
                        if (selectedCount < maxAllowed) {
                            card.classList.add('selected');
                            card.classList.remove('border-outline-variant', 'bg-surface-container');
                            card.classList.add(...colorClasses);
                            selectedCount++;
                        } else {
                            card.animate([
                                { transform: 'translateX(0)' },
                                { transform: 'translateX(-5px)' },
                                { transform: 'translateX(5px)' },
                                { transform: 'translateX(0)' }
                            ], { duration: 300 });
                        }
                    }

                    countDisplay.textContent = selectedCount;
                    
                    if (selectedCount >= minRequired) {
                        continueBtn.disabled = false;
                        continueBtn.classList.remove('bg-surface-container', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                        continueBtn.classList.add('bg-primary', 'text-on-primary', 'hover:bg-primary/90', 'shadow-[0_0_20px_rgba(255,213,151,0.4)]');
                    } else {
                        continueBtn.disabled = true;
                        continueBtn.classList.add('bg-surface-container', 'text-on-surface-variant', 'opacity-50', 'cursor-not-allowed');
                        continueBtn.classList.remove('bg-primary', 'text-on-primary', 'hover:bg-primary/90', 'shadow-[0_0_20px_rgba(255,213,151,0.4)]');
                    }
                });
            });
        });
    </script>
