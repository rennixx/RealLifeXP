<style>
        body {

                linear-gradient(to right, rgba(255, 255, 255, 0.05) 1px, transparent 1px),

        }

        /* Expanding Rings Animation */
        @keyframes expandRing {
            0% { transform: scale(0.8); opacity: 0.8; }
            100% { transform: scale(2.5); opacity: 0; }
        }
        
        .ring-1 { animation: expandRing 2s cubic-bezier(0.165, 0.84, 0.44, 1) infinite; }
        .ring-2 { animation: expandRing 2s cubic-bezier(0.165, 0.84, 0.44, 1) 0.5s infinite; }
        .ring-3 { animation: expandRing 2s cubic-bezier(0.165, 0.84, 0.44, 1) 1s infinite; }

        /* Progress Bar Animation */
        @keyframes fillProgress {
            0% { width: 45%; }
            100% { width: 100%; }
        }
        
        .animate-progress {
            animation: fillProgress 1.5s ease-out forwards;
        }

        .glow-effect {
            box-shadow: 0 0 30px rgba(255, 176, 0, 0.15);
