<style>
        .material-symbols-outlined {
            font-family: 'Material Symbols Outlined';
            font-weight: normal;
            font-style: normal;
            font-size: 24px;
            line-height: 1;
            letter-spacing: normal;
            text-transform: none;
            display: inline-block;
            white-space: nowrap;
            word-wrap: normal;
            direction: ltr;
            -webkit-font-feature-settings: 'liga';
            -webkit-font-smoothing: antialiased;
        }
        
        .premium-card-bg {
            background: linear-gradient(135deg, #131313 0%, #1A1A1A 100%);
            position: relative;
            overflow: hidden;
        }

        .premium-card-bg::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, #FFB000, transparent);
            opacity: 0.5;
        }

        .radiant-glow {
            box-shadow: 0 0 15px rgba(255, 176, 0, 0.4);
        }

        .text-glow {
            text-shadow: 0 0 10px rgba(255, 176, 0, 0.6);
        }

        /* Hide scrollbar for category list if it overflows */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

<body class="bg-background text-on-background min-h-screen flex flex-col font-body-md selection:bg-primary-container selection:text-on-primary-container">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile md:px-margin-desktop py-unit h-16 bg-surface border-b border-surface-variant sticky top-0 z-50">
<div class="flex items-center gap-4">
<button aria-label="Go back" class="text-primary hover:opacity-80 transition-opacity p-2 -ml-2">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary tracking-tight">System Terminal</h1>
</div>
<div class="flex items-center">
<button aria-label="Settings" class="text-on-surface-variant hover:text-primary transition-colors p-2">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</div>
</header>
<main class="flex-grow flex flex-col items-center justify-center p-margin-mobile md:p-margin-desktop gap-8 relative overflow-hidden">
<!-- Abstract background elements to reinforce the solar flare theme -->
<div class="absolute top-[-20%] left-[-10%] w-[60vw] h-[60vw] rounded-full bg-primary-container opacity-5 blur-[120px] pointer-events-none"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[40vw] h-[40vw] rounded-full bg-primary-fixed opacity-5 blur-[100px] pointer-events-none"></div>
<!-- Export Action Bar -->
<div class="w-full max-w-[400px] flex justify-end items-center gap-4 animate-fade-in z-10">
<span class="text-label-caps font-label-caps text-on-surface-variant">READY TO SHARE</span>
<button class="bg-primary-container text-black px-6 py-3 font-label-caps text-label-caps flex items-center gap-2 hover:bg-primary-fixed transition-colors radiant-glow">
<span class="material-symbols-outlined" data-weight="fill" style="font-variation-settings: 'FILL' 1;">download</span>
                EXPORT
            </button>
</div>
<!-- Character Card -->
<div class="w-full max-w-[400px] premium-card-bg border border-[#262626] rounded-none flex flex-col relative z-10 shadow-2xl group" id="capture-area">
<!-- Top Section: Emblem and Identity -->
<div class="p-6 flex flex-col items-center border-b border-surface-variant relative overflow-hidden">
<!-- Subtle grid background -->
<div class="absolute inset-0 bg-[url('data:image/svg+xml;base64,PHN2ZyB3aWR0aD0iMjAiIGhlaWdodD0iMjAiIHhtbG5zPSJodHRwOi8vd3d3LnczLm9yZy8yMDAwL3N2ZyI+PGNpcmNsZSBjeD0iMiIgY3k9IjIiIHI9IjEiIGZpbGw9IiMzNTM1MzQiLz48L3N2Zz4=')] opacity-20"></div>
<div class="w-32 h-32 rounded-full border-2 border-primary-container flex items-center justify-center mb-6 relative radiant-glow bg-surface-container-highest z-10">
<span class="material-symbols-outlined text-6xl text-primary-container" style="font-variation-settings: 'FILL' 1;">electric_bolt</span>
</div>
<div class="text-center z-10">
<h2 class="text-stat-value font-stat-value text-primary-fixed tracking-wider uppercase mb-1">C0M4ND3R</h2>
<p class="text-label-caps font-label-caps text-on-surface-variant tracking-[0.2em]">@zero_sum</p>
</div>
<!-- Title Badge -->
<div class="mt-4 px-4 py-1 border border-primary-container/30 bg-primary-container/10 z-10">
<span class="text-label-caps font-label-caps text-primary-container">VOID WALKER</span>
</div>
</div>
<!-- Middle Section: Vitals -->
<div class="p-6 grid grid-cols-2 gap-4 border-b border-surface-variant bg-surface-container-low">
<div class="flex flex-col items-center justify-center p-4 border border-[#262626]">
<span class="text-label-caps font-label-caps text-on-surface-variant mb-2">GLOBAL LVL</span>
<span class="text-stat-value font-stat-value text-on-background">42</span>
</div>
<div class="flex flex-col items-center justify-center p-4 border border-[#262626]">
<span class="text-label-caps font-label-caps text-on-surface-variant mb-2">TOTAL XP</span>
<span class="text-headline-md font-headline-md text-primary-fixed">124K</span>
</div>
</div>
<!-- Bottom Section: Category Breakdown -->

<div class="text-label-caps font-label-caps text-on-surface-variant mb-2 flex justify-between">
<span>SYSTEMS CALIBRATION</span>
<span>100%</span>
</div>
<!-- Category 1 -->
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-secondary-fixed-dim" style="font-variation-settings: 'FILL' 1;">terminal</span>
<div class="flex-grow flex flex-col gap-1">
<div class="flex justify-between text-label-caps font-label-caps">
<span class="text-on-background">LOGIC CORE</span>
<span class="text-primary-container">LVL 18</span>
</div>
<div class="w-full h-1 bg-surface-variant rounded-none">
<div class="h-full bg-gradient-to-r from-primary-container to-primary-fixed w-[80%] radiant-glow"></div>
</div>
</div>
</div>
<!-- Category 2 -->
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-secondary-fixed-dim" style="font-variation-settings: 'FILL' 1;">memory</span>
<div class="flex-grow flex flex-col gap-1">
<div class="flex justify-between text-label-caps font-label-caps">
<span class="text-on-background">HARDWARE OVERRIDE</span>
<span class="text-primary-container">LVL 12</span>
</div>
<div class="w-full h-1 bg-surface-variant rounded-none">
<div class="h-full bg-gradient-to-r from-primary-container to-primary-fixed w-[45%] radiant-glow"></div>
</div>
</div>
</div>
<!-- Category 3 -->

<span class="material-symbols-outlined text-secondary-fixed-dim" style="font-variation-settings: 'FILL' 1;">speed</span>
<div class="flex-grow flex flex-col gap-1">
