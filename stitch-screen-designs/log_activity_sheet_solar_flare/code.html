<style>

<body class="bg-background text-on-surface antialiased h-screen overflow-hidden relative">
<!-- Main Content Canvas (simulating underlying app view) -->
<main class="relative z-10 w-full h-full flex flex-col items-center justify-center pt-16 pb-20 px-margin-mobile opacity-30 pointer-events-none">

<!-- Overlay Background (Dimming underlying content) -->

<!-- Bottom Sheet Container -->

<!-- Drag Handle -->

<div class="w-12 h-1 bg-surface-variant rounded-full"></div>
</div>
<!-- Sheet Header (Initial View) -->
<div class="px-margin-mobile pb-unit flex justify-between items-center" id="sheetHeader">
<h2 class="font-headline-md text-headline-md text-primary">Log Activity</h2>
<!-- Offline Sync Indicator -->

<span class="material-symbols-outlined text-[14px]">cloud_off</span>
<span class="font-label-caps text-label-caps text-[10px]">Pending sync</span>
</div>
</div>
<!-- Initial View Content: Search & Filters -->
<div class="px-margin-mobile pb-gutter" id="initialViewFilters">
<!-- Search Bar -->
<div class="relative w-full mb-gutter">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-on-surface-variant">search</span>
<input class="w-full bg-surface-container-high border border-surface-container-highest text-on-surface font-body-md text-body-md rounded-DEFAULT pl-10 pr-4 py-2 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary transition-colors placeholder:text-on-surface-variant/50" placeholder="Search templates..." type="text">
</div>
<!-- Category Filters (Horizontal Scroll) -->
<div class="flex gap-2 overflow-x-auto pb-2 -mx-margin-mobile px-margin-mobile scroll-smooth">
<!-- 'All' Chip -->
<button class="flex-shrink-0 px-3 py-1.5 rounded-DEFAULT border border-primary text-primary font-label-caps text-label-caps bg-surface-container-high transition-colors">ALL</button>
<!-- Fitness Chip -->
<button class="flex-shrink-0 px-3 py-1.5 rounded-DEFAULT border border-surface-container-highest text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-container-high transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]">directions_run</span>
                    FITNESS
                </button>
<!-- Knowledge Chip -->
<button class="flex-shrink-0 px-3 py-1.5 rounded-DEFAULT border border-surface-container-highest text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-container-high transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]">menu_book</span>
                    KNOWLEDGE
                </button>
<!-- Creativity Chip -->
<button class="flex-shrink-0 px-3 py-1.5 rounded-DEFAULT border border-surface-container-highest text-on-surface-variant font-label-caps text-label-caps hover:bg-surface-container-high transition-colors flex items-center gap-1">
<span class="material-symbols-outlined text-[12px]">palette</span>
                    CREATIVE
                </button>
</div>
</div>
<!-- Initial View Content: Template List (Scrollable Area) -->
<div class="flex-1 overflow-y-auto px-margin-mobile pb-margin-desktop space-y-gutter" id="templateList">
<h3 class="font-label-caps text-label-caps text-on-surface-variant mb-2">RECENT TEMPLATES</h3>
<!-- Template Item 1 (Fitness) -->
<button class="w-full flex items-center p-3 rounded-DEFAULT bg-surface-container-high border border-surface-container-highest hover:border-primary/30 hover:bg-surface-container-highest transition-all group text-left" onclick="showConfirmation('Morning Run', 'fitness', '+60 XP')">
<div class="w-10 h-10 rounded-DEFAULT bg-primary/10 border border-primary/20 flex items-center justify-center mr-3 group-hover:bg-primary/20 transition-colors">

</div>
<div class="flex-1">

</div>

</button>
<!-- Template Item 2 (Knowledge) -->

<div class="flex-1">

</div>

</button>

<div class="w-10 h-10 rounded-DEFAULT bg-primary/10 border border-primary/20 flex items-center justify-center mr-3 group-hover:bg-primary/20 transition-colors">
<span class="material-symbols-outlined text-primary">palette</span>
</div>
<div class="flex-1">
<div class="font-label-caps text-label-caps text-primary mb-0.5">CREATIVE · DESIGN</div>

</div>
<div class="font-stat-value text-stat-value text-primary-fixed text-lg">+120 XP</div>

</div>

<!-- Confirmation State (Hidden initially) -->

<div class="flex items-center gap-3 mb-margin-desktop pt-2">

</button>

</div>
<!-- XP Tier Indicator (Decorative) -->

</div>
</div>
<!-- Form Details -->

<!-- Time Logged -->
<div class="bg-surface-container-high rounded-DEFAULT p-3 border border-surface-container-highest flex items-center justify-between">
<div class="flex items-center gap-2 text-on-surface">
<span class="material-symbols-outlined text-on-surface-variant text-sm">schedule</span>

</div>
<div class="font-body-lg text-body-lg text-primary">Just Now</div>
</div>
<!-- Duration (Optional) -->
<div class="bg-surface-container-high rounded-DEFAULT p-3 border border-surface-container-highest flex items-center justify-between">
<div class="flex items-center gap-2 text-on-surface">
<span class="material-symbols-outlined text-on-surface-variant text-sm">timer</span>
<span class="font-body-md text-body-md">Duration (opt)</span>
</div>
<input class="w-24 bg-transparent border-b border-surface-container-highest text-right text-primary font-body-lg text-body-lg focus:outline-none focus:border-primary placeholder:text-on-surface-variant/50" placeholder="e.g. 45m" type="text">
</div>
<!-- Notes (Optional) -->
<div class="bg-surface-container-high rounded-DEFAULT p-3 border border-surface-container-highest">
<div class="flex items-center gap-2 text-on-surface mb-2">
<span class="material-symbols-outlined text-on-surface-variant text-sm">notes</span>
<span class="font-body-md text-body-md">Notes (opt)</span>
</div>
<textarea class="w-full bg-transparent border-none p-0 text-primary font-body-md text-body-md focus:ring-0 resize-none h-16 placeholder:text-on-surface-variant/50" placeholder="Add context to this log..."></textarea>
</div>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary-container text-on-primary-container font-headline-md text-headline-md py-4 rounded-DEFAULT mt-margin-desktop flex justify-center items-center gap-2 hover:bg-primary transition-colors active:scale-[0.98] shadow-[0_0_15px_rgba(255,176,0,0.3)] border border-primary-container">
<span class="material-symbols-outlined">bolt</span>
<span id="confirmBtnText">Claim +60 XP</span>
</button>
</div>
</div>
<!-- Minimal JS for UI Interaction -->
<script>
        const bottomSheet = document.getElementById('bottomSheet');
        const overlay = document.getElementById('overlay');
        
        // Views
        const initialFilters = document.getElementById('initialViewFilters');
        const templateList = document.getElementById('templateList');
        const sheetHeader = document.getElementById('sheetHeader');
        const confirmationState = document.getElementById('confirmationState');
        const dragHandle = document.getElementById('dragHandle');

        // Dynamic Elements in Confirmation
        const confirmTitle = document.getElementById('confirmTitle');
        const confirmCategory = document.getElementById('confirmCategory');
        const confirmBtnText = document.getElementById('confirmBtnText');

        function showConfirmation(title, categoryId, xp) {
            // Update Text
            confirmTitle.innerText = title;
            confirmBtnText.innerText = `Claim ${xp}`;
            
            // Determine styling based on category (mock logic for demo)
            let catString = "ACTIVITY";
            let colorClass = "text-on-surface-variant";
            if(categoryId === 'fitness') { catString = "FITNESS · ENDURANCE"; colorClass = "text-primary"; }
            if(categoryId === 'knowledge') { catString = "KNOWLEDGE · FOCUS"; colorClass = "text-primary"; }
            if(categoryId === 'creative') { catString = "CREATIVE · DESIGN"; colorClass = "text-primary"; }
            if(categoryId === 'finance') { catString = "FINANCE · PLANNING"; colorClass = "text-primary"; }
            
            confirmCategory.innerText = catString;
            confirmCategory.className = `font-label-caps text-label-caps mb-0.5 ${colorClass}`;

            // Swap views
            initialFilters.classList.add('hidden');
            templateList.classList.add('hidden');
            sheetHeader.classList.add('hidden');
            dragHandle.classList.add('hidden'); // Hide drag on sub-view for simpler UX
            
            confirmationState.classList.remove('hidden');
            confirmationState.classList.add('flex');
            
            // Adjust height if necessary
            bottomSheet.style.height = 'auto';
        }

        function hideConfirmation() {
            // Swap back
            confirmationState.classList.add('hidden');
            confirmationState.classList.remove('flex');
            
            initialFilters.classList.remove('hidden');
            templateList.classList.remove('hidden');
            sheetHeader.classList.remove('hidden');
            sheetHeader.classList.add('flex');
            dragHandle.classList.remove('hidden');
            
            // Reset scroll
            templateList.scrollTop = 0;
        }

        function closeSheet() {
            bottomSheet.style.transform = 'translateY(100%)';
            overlay.style.opacity = '0';
            setTimeout(() => {
                // In a real app, this would route back or close modal
                alert('Sheet closed. (Demo reset)');
                bottomSheet.style.transform = '';
                overlay.style.opacity = '1';
                hideConfirmation();
            }, 300);
        }
    </script>
</body></html>
