<style>
        body {
            background-color: #0e0e0e; /* surface-container-lowest */
            background-image: radial-gradient(circle at center, rgba(255,255,255,0.03) 1px, transparent 1px);
            background-size: 24px 24px;
        }
        /* Custom scrollbar for horizontal emblem list */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;  /* IE and Edge */
            scrollbar-width: none;  /* Firefox */
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="text-on-surface font-body-md min-h-screen flex flex-col items-center pt-10 pb-8 px-margin-mobile relative overflow-x-hidden">
<!-- Progress Indicator -->
<div class="w-full max-w-md mb-8">
<div class="flex items-center justify-between mb-2">
<span class="text-label-caps font-label-caps text-on-surface-variant">STEP 1/3</span>
<span class="text-label-caps font-label-caps text-primary-fixed-dim">IDENTITY</span>
</div>
<div class="h-1 bg-surface-container-highest rounded w-full overflow-hidden">
<div class="h-full bg-primary-fixed-dim w-1/3 rounded shadow-[0_0_10px_rgba(255,186,67,0.5)]"></div>
</div>
</div>
<!-- Header Copy -->
<div class="w-full max-w-md text-center mb-10">
<h1 class="text-headline-lg-mobile font-headline-lg-mobile text-primary mb-3 tracking-tight">Create Profile</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">Start with who you are. Your stats come next.</p>
</div>
<!-- Main Content Area: Preview & Inputs -->
<div class="w-full max-w-md flex flex-col gap-8">
<!-- Live Preview Card (Glassmorphism / Slabs) -->
<div class="relative w-full rounded p-[1px] bg-gradient-to-b from-surface-variant to-transparent shadow-lg overflow-hidden group">
<!-- Subtle glow behind card -->
<div class="absolute -inset-10 bg-primary-fixed-dim opacity-10 blur-3xl rounded pointer-events-none"></div>
<div class="bg-surface-container rounded p-4 flex items-center gap-4 relative z-10">
<!-- Avatar Preview -->
<div class="w-16 h-16 rounded bg-surface-container-high border border-surface-variant flex items-center justify-center relative overflow-hidden">
<span class="material-symbols-outlined text-3xl text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">
                        person
                    </span>
<div class="absolute inset-0 bg-gradient-to-tr from-primary-fixed-dim/20 to-transparent"></div>
</div>
<!-- Info Preview -->
<div class="flex-1">
<div class="text-label-caps font-label-caps text-on-surface-variant mb-1">LVL 1 NOVICE</div>
<div class="text-headline-md font-headline-md text-primary truncate" id="preview-name">New User</div>
<div class="text-body-md font-body-md text-primary-fixed-dim opacity-80 truncate" id="preview-handle">@handle</div>
</div>
</div>
</div>
<!-- Inputs Form -->
<div class="flex flex-col gap-6">
<!-- Display Name Input -->
<div>
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-2 ml-1" for="display-name">DISPLAY NAME</label>
<input class="w-full bg-surface-container-low border border-surface-variant rounded px-4 py-3 text-body-md font-body-md text-primary placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim transition-colors" id="display-name" oninput="document.getElementById('preview-name').innerText = this.value || 'New User'" placeholder="Enter your name" type="text">
</div>
<!-- @handle Input -->
<div>
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-2 ml-1" for="handle">UNIQUE HANDLE</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 text-on-surface-variant/50">@</span>
<input class="w-full bg-surface-container-low border border-surface-variant rounded pl-8 pr-4 py-3 text-body-md font-body-md text-primary placeholder:text-on-surface-variant/50 focus:outline-none focus:border-primary-fixed-dim focus:ring-1 focus:ring-primary-fixed-dim transition-colors" id="handle" oninput="document.getElementById('preview-handle').innerText = '@' + (this.value || 'handle')" placeholder="username" type="text">
</div>
</div>
<!-- Emblem Selection -->
<div>
<label class="block text-label-caps font-label-caps text-on-surface-variant mb-3 ml-1">CHOOSE EMBLEM</label>
<div class="flex gap-4 overflow-x-auto no-scrollbar pb-2 pt-1 px-1 -mx-1 snap-x">
<!-- Emblem 1 (Selected) -->
<button class="snap-start shrink-0 w-16 h-16 rounded bg-surface-container border-2 border-primary-fixed-dim flex items-center justify-center relative shadow-[0_0_15px_rgba(255,186,67,0.15)] transition-all">
<span class="material-symbols-outlined text-2xl text-primary-fixed-dim" style="font-variation-settings: 'FILL' 1;">person</span>
<!-- Selected Indicator -->
<div class="absolute -top-1.5 -right-1.5 w-4 h-4 bg-primary-fixed-dim rounded flex items-center justify-center border-2 border-surface-container-lowest">
<span class="material-symbols-outlined text-[10px] text-surface-container-lowest font-bold">check</span>
</div>
</button>
<!-- Emblem 2 -->
<button class="snap-start shrink-0 w-16 h-16 rounded bg-surface-container-low border border-surface-variant flex items-center justify-center hover:border-on-surface-variant hover:bg-surface-container transition-all">
<span class="material-symbols-outlined text-2xl text-primary" style="font-variation-settings: 'FILL' 1;">cruelty_free</span>
</button>
<!-- Emblem 3 -->
<button class="snap-start shrink-0 w-16 h-16 rounded bg-surface-container-low border border-surface-variant flex items-center justify-center hover:border-on-surface-variant hover:bg-surface-container transition-all">
<span class="material-symbols-outlined text-2xl text-primary-container" style="font-variation-settings: 'FILL' 1;">local_fire_department</span>
</button>
<!-- Emblem 4 -->
<button class="snap-start shrink-0 w-16 h-16 rounded bg-surface-container-low border border-surface-variant flex items-center justify-center hover:border-on-surface-variant hover:bg-surface-container transition-all">
<span class="material-symbols-outlined text-2xl text-tertiary-fixed" style="font-variation-settings: 'FILL' 1;">palette</span>
</button>
<!-- Emblem 5 -->
<button class="snap-start shrink-0 w-16 h-16 rounded bg-surface-container-low border border-surface-variant flex items-center justify-center hover:border-on-surface-variant hover:bg-surface-container transition-all">
<span class="material-symbols-outlined text-2xl text-on-primary-container" style="font-variation-settings: 'FILL' 1;">psychology</span>
</button>
</div>
</div>
</div>
</div>
<!-- Bottom Actions -->
<div class="w-full max-w-md mt-auto pt-10">
<button class="w-full py-4 rounded bg-primary-fixed-dim text-surface-container-lowest font-headline-md text-headline-md shadow-[0_0_20px_rgba(255,186,67,0.2)] hover:shadow-[0_0_25px_rgba(255,186,67,0.4)] hover:scale-[1.02] transition-all duration-300">
            Continue
        </button>
</div>
</body></html>
