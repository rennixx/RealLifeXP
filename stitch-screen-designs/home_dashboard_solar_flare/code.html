<style>
        body {
            background-color: #131313;
            color: #e5e2e1;
            -webkit-tap-highlight-color: transparent;
        }
        
        .grid-texture {
            background-image: radial-gradient(rgba(255, 176, 0, 0.05) 1px, transparent 1px);
            background-size: 24px 24px;
        }

        .glow-primary {
            box-shadow: 0 0 20px rgba(255, 176, 0, 0.15);
        }

        /* Hide scrollbar for clean UI but keep functionality */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

    body {
      min-height: max(884px, 100dvh);

<body class="bg-background text-on-background grid-texture min-h-screen flex flex-col relative pb-[env(safe-area-inset-bottom)]">
<!-- TopAppBar -->
<header class="flex justify-between items-center w-full px-margin-mobile py-4 bg-surface border-b border-surface-variant sticky top-0 z-40">
<div class="flex items-center gap-gutter">
<div class="w-10 h-10 rounded-none bg-surface-container-high border border-outline flex items-center justify-center shrink-0">
<span class="material-symbols-outlined text-on-surface-variant">person</span>
</div>
<div>
<h1 class="text-headline-md font-headline-md text-primary tracking-wide uppercase">System Terminal</h1>
</div>
</div>
<button class="w-10 h-10 flex items-center justify-center text-on-surface-variant hover:text-primary transition-colors active:scale-95 transition-transform">
<span class="material-symbols-outlined" data-icon="settings">settings</span>
</button>
</header>
<!-- Main Content Canvas -->
<main class="flex-1 overflow-y-auto px-margin-mobile pt-8 pb-24 w-full max-w-4xl mx-auto space-y-12">
<!-- Character Status Header -->
<section class="flex flex-col items-center text-center space-y-6 relative pt-4">
<!-- Ambient Glow Behind Emblem -->
<div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-48 h-48 bg-primary-container/10 blur-[40px] -z-10"></div>
<div class="space-y-2">
<p class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-widest">Greetings, Protocol Alpha</p>
<h2 class="text-headline-lg-mobile font-headline-lg-mobile text-primary-fixed uppercase tracking-wider">The Builder</h2>
</div>
<!-- Level & Progress Ring -->
<div class="relative w-48 h-48 flex items-center justify-center mx-auto my-4">
  <!-- Technical Circular Progress Ring -->
  <svg class="w-full h-full transform -rotate-90 absolute inset-0" viewBox="0 0 100 100">
    <!-- Background Track -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="#201f1f" stroke-width="2"></circle>
    <!-- Active Progress (Gold) -->
    <circle cx="50" cy="50" r="46" fill="none" stroke="#ffba43" stroke-width="2" stroke-dasharray="289" stroke-dashoffset="43" stroke-linecap="square" class="shadow-[0_0_15px_rgba(255,186,67,0.8)]"></circle>
  </svg>
  
  <!-- Centered Level Text Stack -->
  <div class="flex flex-col items-center justify-center z-10">
    <span class="text-label-caps font-headline-md text-primary-fixed-dim uppercase tracking-[0.2em] leading-none mb-1">Level</span>
    <span class="text-headline-xl font-headline-xl text-primary leading-none">7</span>
  </div>
</div>
<div class="flex flex-col items-center space-y-2 w-full max-w-xs mx-auto">
<div class="flex justify-between w-full text-label-caps font-label-caps text-outline"><span class="tracking-tighter">1,240 XP</span><span class="tracking-tighter">1,446 XP</span></div>
<!-- Linear Progress Bar -->
<div class="w-full bg-surface-container-highest rounded-none overflow-hidden border border-surface-variant h-1">
<div class="h-full bg-gradient-to-r from-primary-fixed-dim to-primary-container bg-[length:200%_100%] shadow-[0_0_10px_rgba(255,176,0,0.5)]" style="width: 85%;"></div>
</div>
</div>
<!-- Primary Action -->
<button class="w-full max-w-xs py-4 px-6 bg-primary-container text-on-primary-container rounded-none text-headline-md font-headline-md uppercase tracking-wide shadow-[0_0_20px_rgba(255,176,0,0.2)] hover:bg-primary transition-all duration-200 flex items-center justify-center gap-2 mt-4 border border-primary shadow-[0_0_30px_rgba(255,176,0,0.4)]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">add_circle</span>
                Log Activity
            </button>
</section>
<!-- Active Category Cards (Grid) -->
<section class="space-y-4">
<h3 class="text-label-caps font-label-caps text-on-surface-variant uppercase tracking-widest border-b border-surface-variant pb-2">Active Protocols</h3>
<div class="grid grid-cols-2 md:grid-cols-4 gap-gutter">
<!-- Category: Development -->
<div class="bg-surface-container border border-surface-variant rounded-none p-4 flex flex-col justify-between aspect-square hover:border-primary-container/50 transition-colors group">
<div class="flex justify-between items-start">
<div class="w-8 h-8 rounded-none bg-surface-container-highest flex items-center justify-center text-primary-fixed-dim border border-surface-variant">
<span class="material-symbols-outlined text-sm">code</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">LVL 4</span>
</div>
<div class="mt-auto space-y-3">
<h4 class="text-body-lg font-body-lg text-on-surface uppercase tracking-wider">Development</h4>
<div class="w-full h-1 bg-surface-variant rounded-none overflow-hidden border-l border-r border-surface-variant">
<div class="h-full bg-primary-fixed-dim w-2/3 group-hover:shadow-[0_0_8px_rgba(255,186,67,0.5)] transition-shadow"></div>
</div>
</div>
</div>
<!-- Category: Fitness -->
<div class="bg-surface-container border border-surface-variant rounded-none p-4 flex flex-col justify-between aspect-square hover:border-primary-container/50 transition-colors group">
<div class="flex justify-between items-start">
<div class="w-8 h-8 rounded-none bg-surface-container-highest flex items-center justify-center text-primary-fixed-dim border border-surface-variant">
<span class="material-symbols-outlined text-sm">fitness_center</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">LVL 6</span>
</div>
<div class="mt-auto space-y-3">
<h4 class="text-body-lg font-body-lg text-on-surface uppercase tracking-wider">Fitness</h4>
<div class="w-full h-1 bg-surface-variant rounded-none overflow-hidden border-l border-r border-surface-variant">
<div class="h-full bg-primary-fixed-dim w-4/5 group-hover:shadow-[0_0_8px_rgba(255,186,67,0.5)] transition-shadow"></div>
</div>
</div>
</div>
<!-- Category: Knowledge -->
<div class="bg-surface-container border border-surface-variant rounded-none p-4 flex flex-col justify-between aspect-square hover:border-primary-container/50 transition-colors group">
<div class="flex justify-between items-start">
<div class="w-8 h-8 rounded-none bg-surface-container-highest flex items-center justify-center text-primary-fixed-dim border border-surface-variant">
<span class="material-symbols-outlined text-sm">menu_book</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">LVL 3</span>
</div>
<div class="mt-auto space-y-3">
<h4 class="text-body-lg font-body-lg text-on-surface uppercase tracking-wider">Knowledge</h4>
<div class="w-full h-1 bg-surface-variant rounded-none overflow-hidden border-l border-r border-surface-variant">
<div class="h-full bg-primary-fixed-dim w-1/3 group-hover:shadow-[0_0_8px_rgba(255,186,67,0.5)] transition-shadow"></div>
</div>
</div>
</div>
<!-- Category: Finance -->
<div class="bg-surface-container border border-surface-variant rounded-none p-4 flex flex-col justify-between aspect-square hover:border-primary-container/50 transition-colors group">
<div class="flex justify-between items-start">
<div class="w-8 h-8 rounded-none bg-surface-container-highest flex items-center justify-center text-primary-fixed-dim border border-surface-variant">
<span class="material-symbols-outlined text-sm">payments</span>
</div>
<span class="text-label-caps font-label-caps text-on-surface-variant">LVL 2</span>
</div>
<div class="mt-auto space-y-3">
<h4 class="text-body-lg font-body-lg text-on-surface uppercase tracking-wider">Finance</h4>
<div class="w-full h-1 bg-surface-variant rounded-none overflow-hidden border-l border-r border-surface-variant">
<div class="h-full bg-primary-fixed-dim w-1/2 group-hover:shadow-[0_0_8px_rgba(255,186,67,0.5)] transition-shadow"></div>
</div>
</div>
</div>
</div>
</section>

<a class="flex flex-col items-center justify-center text-primary-fixed-dim scale-110 transition-all duration-300" href="#">
<span class="material-symbols-outlined mb-1" data-icon="home" style="font-variation-settings: 'FILL' 1;">home</span>
<span class="text-label-caps font-label-caps">Home</span>
</a>
<!-- Inactive Tabs -->
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined mb-1" data-icon="person">person</span>

<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined mb-1" data-icon="military_tech">military_tech</span>
<span class="text-label-caps font-label-caps">Trophies</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant hover:text-primary transition-colors" href="#">
<span class="material-symbols-outlined mb-1" data-icon="history">history</span>
<span class="text-label-caps font-label-caps">History</span>
</a>
</nav>
